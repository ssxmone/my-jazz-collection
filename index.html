---
layout: default
---

{% assign sorted = site.data.albums | sort: "artist" %}

<h1 style="text-align:center;">My Jazz Collection</h1>

<div class="grid">
  {% for item in sorted %}
    <div class="album-card">
      <img src="{{ site.baseurl }}/albums/{{ item.file }}" alt="{{ item.artist }} - {{ item.title }}">
      <p class="caption">
        <strong class="title">{{ item.title }}</strong>
        <span class="meta">{{ item.artist }} - {{ item.year }}</span>
      </p>
    </div>
  {% endfor %}
</div>

<style>
/* Ensure consistent sizing */
* { box-sizing: border-box; }

.grid {
  display: grid;
  /* Larger equal columns to make covers bigger */
  grid-template-columns: repeat(3, minmax(360px, 1fr));
  gap: 48px; /* more horizontal distance between columns */
  width: min(1320px, 96%); /* limit overall width but let it expand on large screens */
  max-width: 1320px;
  margin: 0 auto; /* center the grid container */
  padding: 20px;
  justify-content: center; /* center the grid within the available space */
}

.album-card {
  text-align: center;
  width: 100%;
}

/* Make images fill the column width while keeping aspect ratio.
   Limit max-height so very large images don't become too tall. */
.album-card img {
  width: 100%;
  height: auto;
  max-height: 520px;
  border-radius: 8px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.16);
  display: block;
  object-fit: cover;
}

/* Caption layout */
.caption {
  margin-top: 10px;
}

/* Album title (bold) */
.caption .title {
  display: block;
  font-weight: 700;
  color: #222;
  font-size: 1.05rem;
}

/* Artist - Year (smaller, gray) */
.caption .meta {
  display: block;
  margin-top: 6px;
  font-size: 0.88rem;
  color: #666;
}

/* Responsive adjustments */
@media (max-width: 1100px) {
  .grid {
    grid-template-columns: repeat(2, minmax(280px, 1fr));
    gap: 36px;
    width: min(900px, 96%);
  }
}

@media (max-width: 640px) {
  .grid {
    grid-template-columns: 1fr;
    gap: 20px;
    width: 92%;
    padding: 12px;
  }
  .caption .title {
    font-size: 1rem;
  }
}
</style>

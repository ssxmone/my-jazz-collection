---
layout: default
---

{% assign sorted = site.data.albums | sort: "artist" %}

<h1 style="text-align:center;">My Jazz Collection</h1>

<div class="grid">
  {% for item in sorted %}
    <div class="album-card">
      <img src="{{ site.baseurl }}/albums/{{ item.file }}" alt="{{ item.artist }} - {{ item.title }}">
      <p class="caption">
        <strong class="title">{{ item.title }}</strong>
        <span class="meta">{{ item.artist }} - {{ item.year }}</span>
      </p>
    </div>
  {% endfor %}
</div>

<style>
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 24px;
  max-width: 1500px;
  margin: 0 auto;
  padding: 20px;
}

.album-card {
  text-align: center;
}

.album-card img {
  width: 100%;
  height: auto;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

/* Caption layout */
.caption {
  margin-top: 8px;
}

/* Album title (bold) */
.caption .title {
  display: block;
  font-weight: 700;
  color: #222;
  font-size: 1rem;
}

/* Artist - Year (smaller, gray) */
.caption .meta {
  display: block;
  margin-top: 4px;
  font-size: 0.85rem;
  color: #666;
}
</style>

---
layout: default
---

{% assign sorted = site.data.albums | sort: "artist" %}

<h1 style="text-align:center;">My Jazz Collection</h1>

<div class="grid">
  {% for item in sorted %}
    <div class="album-card">
      <img src="{{ site.baseurl }}/albums/{{ item.file }}" alt="{{ item.artist }} - {{ item.title }}">
      <p class="caption">
        <strong class="title">{{ item.title }}</strong>
        <span class="meta">{{ item.artist }} - {{ item.year }}</span>
      </p>
    </div>
  {% endfor %}
</div>

<style>
.grid {
  display: grid;
  /* Force three equal columns on wide screens; increase the min to make covers larger */
  grid-template-columns: repeat(3, minmax(300px, 1fr));
  gap: 24px;
  max-width: 1200px; /* Wider columns across the page */
  margin: 0 auto;
  padding: 20px;
  justify-items: center;
}

.album-card {
  text-align: center;
  width: 100%;
}

/* Make images fill the column width while keeping aspect ratio */
.album-card img {
  width: 100%;
  height: auto;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  display: block;
  object-fit: cover;
}

/* Caption layout */
.caption {
  margin-top: 8px;
}

/* Album title (bold) */
.caption .title {
  display: block;
  font-weight: 700;
  color: #222;
  font-size: 1rem;
}

/* Artist - Year (smaller, gray) */
.caption .meta {
  display: block;
  margin-top: 4px;
  font-size: 0.85rem;
  color: #666;
}

/* Responsive adjustments */
@media (max-width: 1000px) {
  .grid {
    grid-template-columns: repeat(2, minmax(240px, 1fr));
    max-width: 900px;
  }
}

@media (max-width: 600px) {
  .grid {
    grid-template-columns: 1fr;
    max-width: 420px;
    padding: 12px;
  }
  .caption .title {
    font-size: 0.98rem;
  }
}
</style>
